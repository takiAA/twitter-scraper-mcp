name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:twscrape
      - run: npm run format:check
      - run: npm test
      - run: npm run test:client
      - run: npm run publication:check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add synthetic excluded build-context fixtures
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for name in ["python/__pycache__/fixture.pyc", "python/.env.fixture", "python/session-cookies.json", "python/accounts.db"]:
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("synthetic fixture; no credentials")
          PYTHON
      - run: docker build -t twitter-scraper-mcp:test .
      - name: Check runtime artifact boundary
        run: |
          docker run --rm --entrypoint python3 twitter-scraper-mcp:test -c 'from pathlib import Path; assert not any(p.name == "__pycache__" or p.suffix in (".pyc", ".db") or p.name.startswith(".env") or ("cookie" in p.name.lower() and p.suffix in (".json", ".txt")) for p in Path("/app/python").rglob("*")); assert not Path("/app/scripts/auth-browser.js").exists(); assert not Path("/app/node_modules/@steipete/sweet-cookie").exists()'

      - name: Check stdio initialization
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | docker run --rm -i twitter-scraper-mcp:test > response.jsonl
          node -e 'const fs=require("fs");const messages=fs.readFileSync("response.jsonl","utf8").trim().split("\n").map(JSON.parse);if(!messages.some(m=>m.id===1&&m.result?.serverInfo?.name==="twitter-mcp-server"))process.exit(1)'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full checked-out Git history
        run: ./gitleaks git --redact=100 --no-banner --config .gitleaks.toml --log-opts="--all"
