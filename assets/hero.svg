<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Twitter / X MCP — your X session, your agent</title>
  <desc id="desc">A local MCP server connects agents to public post lookup, session research and explicitly enabled writes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#13283a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7ce9c6"/><stop offset="1" stop-color="#87bdff"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <g fill="none" stroke="#284454" opacity=".35"><path d="M780 0v360M900 0v360M1020 0v360M1140 0v360M700 60h580M700 180h580M700 300h580"/></g>
  <rect x="48" y="40" width="244" height="30" rx="15" fill="#203d3b"/>
  <text x="64" y="60" fill="#9ff2d4" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">LOCAL · SESSION · MCP</text>
  <text x="48" y="139" fill="#f4f8fc" font-family="Arial, sans-serif" font-size="46" font-weight="700">Your X session.</text>
  <text x="48" y="194" fill="url(#accent)" font-family="Arial, sans-serif" font-size="46" font-weight="700">Your agent.</text>
  <text x="50" y="242" fill="#b2c3d4" font-family="Arial, sans-serif" font-size="18">Search posts. Read timelines. Explore conversations.</text>
  <text x="50" y="283" fill="#87a4b8" font-family="Arial, sans-serif" font-size="14">TWITTER-SCRAPER-MCP / Structured context over stdio</text>
  <g font-family="Arial, sans-serif">
    <rect x="788" y="47" width="428" height="72" rx="13" fill="#142d3b" stroke="#365663"/>
    <circle cx="820" cy="83" r="9" fill="#82dbc5"/>
    <text x="844" y="77" fill="#eef7fc" font-size="17" font-weight="700">Public lookup</text>
    <text x="844" y="100" fill="#9bb6c7" font-size="13">Read a post link without signing in</text>
    <rect x="788" y="137" width="428" height="72" rx="13" fill="#142d3b" stroke="#365663"/>
    <circle cx="820" cy="173" r="9" fill="#8fbdff"/>
    <text x="844" y="167" fill="#eef7fc" font-size="17" font-weight="700">Session research</text>
    <text x="844" y="190" fill="#9bb6c7" font-size="13">Your local cookies · bounded results</text>
    <rect x="788" y="227" width="428" height="72" rx="13" fill="#142d3b" stroke="#365663"/>
    <circle cx="820" cy="263" r="9" fill="#f4c981"/>
    <text x="844" y="257" fill="#eef7fc" font-size="17" font-weight="700">Explicit writes</text>
    <text x="844" y="280" fill="#9bb6c7" font-size="13">Off by default · no automatic mutation retries</text>
  </g>
</svg>
